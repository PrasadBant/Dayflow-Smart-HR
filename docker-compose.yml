version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: dayflow-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dayflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-dayflow_db}
      # Read by database/a7_rls.sql at init time to set the dayflow_app
      # role's password — keep this in sync with APP_DB_PASSWORD below
      # (docker compose substitutes both from the same .env value).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dayflow_app_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dayflow-hrms/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./dayflow-hrms/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      # a7_rls.sql is mounted as a template (not *.sql, so Postgres's own
      # init runner won't execute it directly) and applied by init-rls.sh,
      # which substitutes the real APP_DB_PASSWORD into it first — see both
      # files for why (the role password must not be a literal committed
      # value once it's configurable).
      - ./dayflow-hrms/database/a7_rls.sql:/docker-entrypoint-initdb.d/a7_rls.sql.template
      - ./dayflow-hrms/database/init-rls.sh:/docker-entrypoint-initdb.d/03-rls.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow_user -d dayflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: dayflow-backend
    restart: always
    environment:
      PORT: 5000
      # Connects as the dedicated non-superuser `dayflow_app` role (created by
      # database/a7_rls.sql), NOT the POSTGRES_USER above — that user is the
      # postgres image's initdb superuser, and superusers always bypass row
      # level security regardless of FORCE ROW LEVEL SECURITY. Connecting as
      # dayflow_app is what makes the RLS policies actually apply to the
      # app's real traffic instead of being decorative.
      DATABASE_URL: postgres://${APP_DB_USER:-dayflow_app}:${APP_DB_PASSWORD:-dayflow_app_password}@db:5432/${POSTGRES_DB:-dayflow_db}
      # No secret is hardcoded here. Override JWT_SECRET via a root .env file
      # (see .env.example) for any non-throwaway-local run; this fallback is a
      # freshly-generated, non-production value with no prior exposure.
      JWT_SECRET: ${JWT_SECRET:-1269c1c80fdd94015120dac69e2c28f3de3d3519db5aed5ebfe08a862eb6f8ac}
      FRONTEND_ORIGIN: http://localhost:3000
      NODE_ENV: production
      # Optional — leave unset (the default) to fall back to logging
      # verification links to `docker logs dayflow-backend` instead of a
      # real send. Set all of SMTP_HOST/PORT/USER/PASS/FROM via a root .env
      # (see .env.example) to send real verification email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Vite Frontend Web Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: dayflow-frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:

version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: dayflow-db
    restart: always
    environment:
      POSTGRES_USER: dayflow_user
      POSTGRES_PASSWORD: dayflow_password
      POSTGRES_DB: dayflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dayflow-hrms/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./dayflow-hrms/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./dayflow-hrms/database/a7_rls.sql:/docker-entrypoint-initdb.d/03-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow_user -d dayflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: dayflow-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgres://dayflow_user:dayflow_password@db:5432/dayflow_db
      JWT_SECRET: 5371e0d1eb814ece68a485c1ecf1905622c4f51044de40973f8141cfe8f75fd8
      FRONTEND_ORIGIN: http://localhost:3000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Vite Frontend Web Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: dayflow-frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:

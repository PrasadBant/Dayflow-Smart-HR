server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline HTTP security headers (the API side gets these from helmet()).
    # nginx does NOT inherit add_header from an outer block into a location
    # that declares its own add_header — each location below that sets its
    # own Cache-Control must therefore repeat these explicitly, or they'd
    # silently vanish on every real response (only a location with zero
    # add_header of its own would inherit these three).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Single-page app: any path that isn't a real static file falls back to
    # index.html so React Router can handle it client-side. Without this,
    # nginx's default config 404s on every route except "/" — a page
    # refresh or a direct link to /login, /dashboard, etc. was broken.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets (dist/assets/*) are safe to cache
    # aggressively; index.html itself must always be revalidated so a new
    # deploy is picked up on next load rather than staying pinned to a
    # cached, now-stale asset manifest.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }
}

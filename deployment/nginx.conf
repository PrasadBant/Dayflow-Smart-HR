server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real static file falls back to
    # index.html so React Router can handle it client-side. Without this,
    # nginx's default config 404s on every route except "/" — a page
    # refresh or a direct link to /login, /dashboard, etc. was broken.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets (dist/assets/*) are safe to cache
    # aggressively; index.html itself must always be revalidated so a new
    # deploy is picked up on next load rather than staying pinned to a
    # cached, now-stale asset manifest.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

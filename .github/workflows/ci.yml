name: CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dayflow-hrms/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dayflow-hrms/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: Run Unit/Security Tests
        run: |
          npx ts-node tests/auth.test.ts
          npx ts-node tests/signup.test.ts
          npx ts-node tests/leave.overlap.test.ts
          npx ts-node tests/authz-idor.test.ts

      # Fails the build on a HIGH/CRITICAL advisory in a real dependency
      # (direct or transitive). Pinned to --audit-level=high rather than
      # the default (moderate) because two documented, currently-unfixable
      # moderate advisories exist (express's transitive `qs`, and
      # react-router pending a reviewed major-version migration) — blocking
      # every build on those would make this gate a no-op people learn to
      # ignore. A newly introduced high/critical vulnerability still fails
      # the build, which is the actual point of this step.
      - name: Dependency Security Audit
        run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dayflow-hrms/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dayflow-hrms/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check & Build
        run: npm run build

      - name: Dependency Security Audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev

  # Real end-to-end integration coverage against the actual Docker Compose
  # stack this project ships (real Postgres + RLS, real Express backend,
  # real nginx-served frontend) — not a substitute for the backend/frontend
  # jobs above, which only prove each side builds and its own unit tests
  # pass in isolation. This is the gate that would have caught, for
  # example, the RLS-bypass defect found and fixed in an earlier hardening
  # pass: something no unit test mocking the database could ever exercise.
  e2e:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    # Production configuration now fails closed (backend/src/config/env.ts):
    # NODE_ENV=production (hardcoded in docker-compose.yml) refuses to start
    # with docker-compose.yml's own default JWT secret, default DB password,
    # or no SMTP configured. These are real, CI-only values — generated for
    # this workflow, never used anywhere else, and not secret in any
    # meaningful sense (this job's whole database is destroyed at the end of
    # the run) — just distinct from the rejected defaults so the stack can
    # actually start. SMTP points at a host that doesn't exist; email send
    # attempts fail per-request exactly as they would against any
    # unreachable SMTP server (see mailer.service.ts's try/catch fallback)
    # without blocking startup, since env.ts only requires SMTP_HOST/FROM to
    # be *present*, not reachable.
    env:
      JWT_SECRET: ci_e2e_generated_secret_2c6f9a1b8d3e7401f5c2a9b6d8e1f4c7
      APP_DB_PASSWORD: ci_e2e_generated_db_password_9f4a2c
      FRONTEND_ORIGIN: http://localhost:3000
      SMTP_HOST: smtp.ci-e2e.invalid
      SMTP_PORT: 587
      SMTP_FROM: no-reply@ci-e2e.invalid

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up --build -d

      - name: Wait for all services to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null && curl -sf http://localhost:3000/ > /dev/null; then
              echo "Stack is up.";
              exit 0;
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time." >&2
          docker compose logs
          exit 1

      # Runs the same 7-suite runner used throughout local verification,
      # from a container on the compose network so it reaches the real
      # backend/database by their service names — no port-forwarding
      # assumptions, no dependency on the runner's own Node version.
      - name: Run full E2E suite against the live stack
        run: |
          docker run --rm --network dayflow-smart-hr_default \
            -e DATABASE_URL="postgres://dayflow_app:${APP_DB_PASSWORD}@db:5432/dayflow_db" \
            -e VITE_API_URL="http://backend:5000/api" \
            -e JWT_SECRET="ci_e2e_client_env_not_used_for_signing_2026" \
            -e FRONTEND_ORIGIN="http://localhost:3000" \
            -e PORT="5000" \
            -v "${{ github.workspace }}:/app" -w /app/dayflow-hrms node:20-alpine \
            sh -c "npm ci && npm run e2e"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

name: CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          elif [ -f dayflow-hrms/package.json ]; then
            cd dayflow-hrms && (npm ci || npm install)
          else
            echo "No package.json found yet."
          fi

      - name: Type Check & Build
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          elif [ -f dayflow-hrms/package.json ]; then
            cd dayflow-hrms && npm run build --if-present
          else
            echo "No package.json found for build."
          fi

      - name: Run Tests
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          elif [ -f dayflow-hrms/package.json ]; then
            cd dayflow-hrms && npm test --if-present
          else
            echo "No package.json found for tests."
          fi
